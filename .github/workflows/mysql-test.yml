name: MySQL TideSQL Storage Engine Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Pinned build versions, the single place to move from one release to the next.
# TIDESDB_REF is a ref on tidesdb/tidesdb, MYSQL_VERSION a tag on
# mysql/mysql-server.  Bump them together to retarget the whole matrix.
#
# NOTE: TIDESDB_REF is a BRANCH, not a tag.  The library's v10 line is not
# tagged yet -- its newest tag is v9.3.15, and 10.0.0 and 10.0.1 exist only as
# branches -- so this pin moves under CI and a run is not reproducible from the
# ref alone.  Each job prints the commit the branch resolved to for that reason.
# Make this a tag once v10.0.1 is tagged.
env:
  TIDESDB_REF: "10.0.1"
  MYSQL_VERSION: "mysql-9.7.0"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      # The test suite is assembled from symlinks (see "Materialize" below), and a
      # Windows checkout writes those out as text stubs unless git is told to make
      # real links.  This has to run before the checkout that creates them.
      - name: Allow symlinks in the checkout (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout TideSQL
        uses: actions/checkout@v4
        with:
          path: tidesql

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git bison ccache pkg-config \
            libssl-dev libncurses-dev libudev-dev \
            liblz4-dev libzstd-dev libsnappy-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja bison openssl@3 lz4 zstd snappy ccache
          # macOS ships bison 2.3; the server's parser needs 3.x, so the keg-only
          # one has to come first on PATH for the whole job.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y winflexbison3 ninja
          vcpkg install zstd:x64-windows lz4:x64-windows snappy:x64-windows

      - name: Configure ccache (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "/usr/lib/ccache:/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ env.MYSQL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ env.MYSQL_VERSION }}-

      - name: Cache the TidesDB library build
        id: tidesdb-cache
        uses: actions/cache@v4
        with:
          path: tidesdb-install
          key: tidesdb-${{ matrix.os }}-${{ env.TIDESDB_REF }}-${{ github.run_id }}

      - name: Build and install the TidesDB library
        shell: bash
        run: |
          set -euo pipefail
          # The plugin links libtidesdb and its build skips itself entirely when it
          # cannot find it, so this has to succeed before the server is configured.
          if [ ! -d tidesdb-install ]; then
            git clone --depth 1 --branch "${TIDESDB_REF}" \
              https://github.com/tidesdb/tidesdb.git tidesdb-src
            # record what the branch actually resolved to, so a failing run can be
            # tied back to a commit even though the ref itself moves
            git -C tidesdb-src rev-parse HEAD
            # Every allocator option defaults to OFF, so this links the system
            # allocator and the plugin needs no LD_PRELOAD to load.  A build that
            # turns jemalloc/mimalloc/tcmalloc on would -- see
            # doc/01-getting-started/install.md.
            cmake -S tidesdb-src -B tidesdb-build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PWD/tidesdb-install"
            cmake --build tidesdb-build --parallel
            cmake --install tidesdb-build
          fi
          echo "TIDESDB_ROOT=$PWD/tidesdb-install" >> "$GITHUB_ENV"

      - name: Clone the MySQL server
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if git clone --depth 1 --branch "$MYSQL_VERSION" \
                 https://github.com/mysql/mysql-server.git mysql-server; then
              exit 0
            fi
            echo "clone attempt $i failed, retrying in 10s"
            rm -rf mysql-server
            sleep 10
          done
          echo "could not clone mysql-server at $MYSQL_VERSION"
          exit 1

      - name: Copy the storage engine into the server tree
        shell: bash
        run: cp -R tidesql/tidesdb mysql-server/storage/tidesdb

      # MySQL's mtr resolves a suite name only against mysql-test/suite,
      # plugin/<suite>/tests and a few internal/ paths -- it does not search
      # storage/<engine>/mysql-test the way some other servers do.  Left out, the
      # build is green and nothing is tested, so both suites are placed where mtr
      # looks and the copy is checked.
      - name: Install the test suites where mtr looks for them
        shell: bash
        run: |
          set -euo pipefail
          src=tidesql/tidesdb/mysql-test
          dst=mysql-server/mysql-test/suite
          mkdir -p "$dst"
          for suite in tidesdb tidesdb_rpl; do
            rm -rf "$dst/$suite"
            cp -R "$src/$suite" "$dst/$suite"
          done
          echo "tidesdb: $(ls "$dst"/tidesdb/t/*.test | wc -l) tests"
          echo "tidesdb_rpl: $(ls "$dst"/tidesdb_rpl/t/*.test | wc -l) tests"

      - name: Configure and build the server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DWITH_SSL=$(brew --prefix openssl@3)"
          fi
          # Boost ships vendored in the server tree, so nothing is downloaded.
          cmake -S mysql-server -B mysql-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $EXTRA
          cmake --build mysql-server/build --parallel 2>&1 | tee build.log

      - name: Configure and build the server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S mysql-server -B mysql-server/build -G "Visual Studio 17 2022" -A x64 \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build mysql-server/build --config RelWithDebInfo --parallel 2>&1 | tee build.log

      # The plugin's own CMake returns early with only a STATUS message when it
      # cannot find libtidesdb, which would otherwise leave a green build with no
      # engine in it.
      - name: Check the plugin was actually built
        shell: bash
        run: |
          set -euo pipefail
          found=$(find mysql-server/build -name 'ha_tidesdb.*' \
                    \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | head -1)
          if [ -z "$found" ]; then
            echo "ha_tidesdb was not built -- the plugin's CMake most likely did not find libtidesdb"
            grep -i "TidesDB:" build.log | head -20 || true
            exit 1
          fi
          echo "built: $found"

      # RULES.md rule 8 is zero warnings, for this plugin rather than for the whole
      # server, so the filter keeps only diagnostics whose path is in the engine.
      - name: Zero-warning gate
        shell: bash
        run: |
          set -euo pipefail
          warnings=$(tr '\\' '/' < build.log \
                     | grep -i 'warning' \
                     | grep 'storage/tidesdb/' || true)
          if [ -n "$warnings" ]; then
            echo "plugin build is not warning-clean:"
            echo "$warnings"
            exit 1
          fi
          echo "no warnings from storage/tidesdb"

      - name: Run the TideSQL test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: mysql-server/build/mysql-test
        run: ./mtr --suite=tidesdb,tidesdb_rpl --parallel=4 --force --retry=1 2>&1 | tee ../../../mtr.log

      - name: Run the TideSQL test suite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: mysql-server/build/mysql-test
        run: perl mysql-test-run.pl --suite=tidesdb,tidesdb_rpl --parallel=2 --force --retry=1 2>&1 | tee ../../../mtr.log

      # mtr reports success for an empty run, so a suite it failed to find would
      # otherwise pass.  The floor is deliberately loose: it catches "nothing ran",
      # not a single removed test.
      - name: Check the suite actually ran
        shell: bash
        run: |
          set -euo pipefail
          line=$(grep -E 'Completed: All [0-9]+ tests were successful' mtr.log | tail -1 || true)
          if [ -z "$line" ]; then
            echo "no success line in the mtr output"
            exit 1
          fi
          n=$(echo "$line" | grep -oE '[0-9]+' | head -1)
          echo "$n tests passed"
          if [ "$n" -lt 50 ]; then
            echo "only $n tests ran; a suite was not picked up in full"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            build.log
            mtr.log
            mysql-server/build/mysql-test/var/log/**/*.err
            mysql-server/build/mysql-test/var/log/**/*.reject
          retention-days: 7
          if-no-files-found: ignore

  sanitizers:
    name: ASAN + UBSAN (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TideSQL
        uses: actions/checkout@v4
        with:
          path: tidesql

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git bison ccache pkg-config \
            libssl-dev libncurses-dev libudev-dev \
            liblz4-dev libzstd-dev libsnappy-dev

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=max_size=2G

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ env.MYSQL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ env.MYSQL_VERSION }}-

      - name: Build and install the TidesDB library
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${TIDESDB_REF}" \
            https://github.com/tidesdb/tidesdb.git tidesdb-src
          git -C tidesdb-src rev-parse HEAD
          cmake -S tidesdb-src -B tidesdb-build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build tidesdb-build --parallel
          sudo cmake --install tidesdb-build
          sudo ldconfig

      - name: Clone the MySQL server
        run: |
          git clone --depth 1 --branch "$MYSQL_VERSION" \
            https://github.com/mysql/mysql-server.git mysql-server

      - name: Copy the storage engine and the suite into the server tree
        run: |
          set -euo pipefail
          cp -R tidesql/tidesdb mysql-server/storage/tidesdb
          for suite in tidesdb tidesdb_rpl; do
            cp -R "tidesql/tidesdb/mysql-test/$suite" "mysql-server/mysql-test/suite/$suite"
          done

      # Only the plugin is instrumented; the server around it is not.  That is the
      # supported shape -- the sanitizer runtimes are preloaded so the plugin's
      # undefined __asan_*/__ubsan_* symbols resolve at dlopen, which is also what
      # proves the instrumentation is live: without the preload the plugin cannot
      # load at all and every test fails on have_tidesdb.inc.
      - name: Build the server with an instrumented plugin
        run: |
          set -euo pipefail
          cmake -S mysql-server -B mysql-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_BOOST="$PWD/mysql-server/extra/boost" \
            -DWITH_UNIT_TESTS=OFF \
            -DTIDESDB_WITH_ASAN=ON -DTIDESDB_WITH_UBSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build mysql-server/build --parallel 2>&1 | tee build.log
          # the instrumentation has to actually be in the object, not just requested
          nm -D mysql-server/build/plugin_output_directory/ha_tidesdb.so \
            | grep -c "__asan" \
            || { echo "plugin carries no ASAN symbols; it was not instrumented"; exit 1; }

      - name: Run the suite under the sanitizers
        working-directory: mysql-server/build/mysql-test
        run: |
          set -euo pipefail
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          # The server itself is uninstrumented, so its allocations would dominate a
          # leak report; the interest here is the plugin's own memory errors.
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:halt_on_error=0:detect_odr_violation=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=0
          ./mtr --suite=tidesdb,tidesdb_rpl --parallel=2 --force --retry=0 2>&1 | tee ../../../mtr.log

      - name: Fail on any sanitizer report
        run: |
          set -euo pipefail
          pattern='ERROR: AddressSanitizer|runtime error:|SUMMARY: (Address|Undefined)'
          hits=$( { grep -hEc "$pattern" mtr.log || true; } )
          logs=$( { grep -rhE "$pattern" mysql-server/build/mysql-test/var/*/log/*.err 2>/dev/null || true; } )
          if [ "${hits:-0}" -ne 0 ] || [ -n "$logs" ]; then
            echo "sanitizer reports:"
            grep -hE "$pattern" mtr.log | head -40 || true
            echo "$logs" | head -40
            exit 1
          fi
          echo "clean: no ASAN or UBSAN reports"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sanitizers
          path: |
            build.log
            mtr.log
            mysql-server/build/mysql-test/var/log/**/*.err
          retention-days: 7
          if-no-files-found: ignore
